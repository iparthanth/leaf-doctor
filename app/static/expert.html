<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaf Doctor — Expert desk</title>
<style>
  :root{--paddy:#0B6E4F;--cream:#F7F3E8;--line:#E4DCC8;--ink:#1F1A14;--soil:#5A4636;--red:#B3261E}
  *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 "Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}
  header{background:var(--paddy);color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header h1{font-size:19px;margin:0;flex:1}
  input,textarea,button{font:inherit} input{padding:8px 10px;border-radius:8px;border:1px solid var(--line);min-width:220px}
  button{background:var(--paddy);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
  button.ghost{background:transparent;border:1px solid #fff}
  main{max-width:980px;margin:0 auto;padding:16px}
  .case{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
  .meta{color:var(--soil);font-size:14px}
  .msg{border-radius:10px;padding:8px 12px;background:#E3F0E8;max-width:720px}
  .msg.expert{background:#fff;border:1px solid var(--line)}
  textarea{width:100%;min-height:70px;padding:8px;border-radius:8px;border:1px solid var(--line)}
  .empty{color:var(--soil);text-align:center;padding:40px 0}
  .err{color:var(--red)}
</style>
</head>
<body>
<header>
  <h1>পাতা ডাক্তার — বিশেষজ্ঞ ডেস্ক · Expert desk</h1>
  <input id="tok" type="password" placeholder="Expert token" autocomplete="current-password">
  <button class="ghost" id="load">Load</button>
</header>
<main id="list"><p class="empty">Enter the expert token to see open questions.</p></main>
<script>
const $ = s => document.querySelector(s);
const tok = () => $('#tok').value.trim();
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
async function load(){
  const list = $('#list'); list.textContent = '';
  try {
    const r = await fetch('/api/v1/expert/cases', {headers: {Authorization: 'Bearer ' + tok()}});
    if (!r.ok) { list.append(el('p', 'err', r.status === 401 ? 'Wrong token.' : 'Error ' + r.status)); return; }
    const cases = await r.json();
    if (!cases.length) { list.append(el('p', 'empty', 'No open questions. কোনো প্রশ্ন নেই।')); return; }
    for (const c of cases) {
      const card = el('section', 'case');
      const top = c.top.map(t => `${t.label} ${(t.confidence*100).toFixed(0)}%`).join(' · ');
      card.append(el('div', 'meta', `${new Date(c.created*1000).toLocaleString()} · crop: ${c.crop || '—'} · district: ${c.district || '—'} · app said: ${c.verdict} (${top})`));
      for (const m of c.messages) card.append(el('div', 'msg ' + m.sender, (m.sender === 'expert' ? 'Expert: ' : 'Farmer: ') + m.body));
      const ta = el('textarea'); ta.placeholder = 'উত্তর লিখুন · Write the reply (Bangla preferred)';
      const b = el('button', null, 'Send reply');
      b.onclick = async () => {
        if (!ta.value.trim()) return;
        b.disabled = true;
        const r2 = await fetch(`/api/v1/expert/cases/${encodeURIComponent(c.id)}/reply`, {method: 'POST',
          headers: {Authorization: 'Bearer ' + tok(), 'Content-Type': 'application/json'}, body: JSON.stringify({body: ta.value.trim()})});
        if (r2.ok) load(); else { b.disabled = false; alert('Error ' + r2.status); }
      };
      card.append(ta, b); list.append(card);
    }
  } catch (e) { list.append(el('p', 'err', String(e))); }
}
$('#load').onclick = load;
$('#tok').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
</script>
</body>
</html>
